<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">MovieFlix</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="#">TV Shows</a>
            <a href="#">My List</a>
        </nav>
    </header>

    <section class="hero">
        <video autoplay muted loop playsinline class="hero-video">
            <source src="assets/videoplayback1.mp4" type="video/mp4">
        </video>

        <div class="overlay"></div>

        <div class="hero-content">
            <h1>F1</h1>
            <p>Watch the latest blockbuster movies and TV shows.</p>

            <button class="play-btn">
                ▶ Play
            </button>
        </div>
    </section>

    <main>
        <h2>Trending Now</h2>

        <div class="movie-grid">
            <img src="assets/download.jpg" alt="Movie 1" class="movie-card">
            <img src="assets/download (1).jpg" alt="Movie 2" class="movie-card">
            <img src="assets/download (2).jpg" alt="Movie 3" class="movie-card">
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
